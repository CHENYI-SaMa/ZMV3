<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理 - 织麦电竞后台</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="sidebar-toggle" id="sidebarToggle">
            <i class="fa fa-bars"></i>
          </button>
          <span class="page-title">订单管理</span>
        </div>
        <div class="header-right">
          <div class="header-actions">
            <div class="user-dropdown" id="userDropdown">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=admin" alt="avatar" class="user-avatar">
              <div class="header-user-info"><span class="user-name">管理员</span><span class="header-user-role">超管</span></div>
              <i class="fa fa-chevron-down" style="font-size: 12px; color: var(--text-muted);"></i>
              <div class="dropdown-menu" id="dropdownMenu">
                <a href="#"><i class="fa fa-user"></i> 个人中心</a>
                <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> 退出登录</a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div class="content-wrapper">
        <div class="stats-row" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px;">
          <div class="stat-card" style="cursor: pointer;" onclick="filterByStatus('pending')">
            <div class="stat-icon" style="background: rgba(250, 173, 20, 0.1); color: #faad14;">
              <i class="fa fa-clock"></i>
            </div>
            <div class="stat-info">
              <span class="stat-value" id="statPending">0</span>
              <span class="stat-label">待支付</span>
            </div>
          </div>
          <div class="stat-card" style="cursor: pointer;" onclick="filterByStatus('paid')">
            <div class="stat-icon" style="background: rgba(24, 144, 255, 0.1); color: #1890ff;">
              <i class="fa fa-credit-card"></i>
            </div>
            <div class="stat-info">
              <span class="stat-value" id="statPaid">0</span>
              <span class="stat-label">待处理</span>
            </div>
          </div>
          <div class="stat-card" style="cursor: pointer;" onclick="filterByStatus('processing')">
            <div class="stat-icon" style="background: rgba(108, 99, 255, 0.1); color: var(--primary);">
              <i class="fa fa-cog"></i>
            </div>
            <div class="stat-info">
              <span class="stat-value" id="statProcessing">0</span>
              <span class="stat-label">处理中</span>
            </div>
          </div>
          <div class="stat-card" style="cursor: pointer;" onclick="filterByStatus('completed')">
            <div class="stat-icon" style="background: rgba(82, 196, 26, 0.1); color: #52c41a;">
              <i class="fa fa-check-circle"></i>
            </div>
            <div class="stat-info">
              <span class="stat-value" id="statCompleted">0</span>
              <span class="stat-label">已完成</span>
            </div>
          </div>
        </div>

        <div class="filter-bar">
          <div class="filter-left">
            <div class="filter-item">
              <select class="filter-select" id="filterStatus">
                <option value="">全部状态</option>
                <option value="pending">待支付</option>
                <option value="paid">待处理</option>
                <option value="processing">处理中</option>
                <option value="completed">已完成</option>
                <option value="cancelled">已取消</option>
              </select>
            </div>
            <div class="filter-item">
              <input type="text" class="filter-input" id="filterOrderId" placeholder="搜索订单号">
            </div>
            <div class="filter-item">
              <input type="text" class="filter-input" id="filterUser" placeholder="搜索用户">
            </div>
            <button class="btn btn-primary" onclick="applyFilter()">
              <i class="fa fa-search"></i> 搜索
            </button>
            <button class="btn btn-outline" onclick="resetFilter()">
              <i class="fa fa-undo"></i> 重置
            </button>
          </div>
        </div>

        <div class="data-card">
          <div class="table-header">
            <span class="table-title">订单列表</span>
            <div class="table-actions">
              <button class="btn btn-sm btn-outline" onclick="exportOrders()">
                <i class="fa fa-download"></i> 导出
              </button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>订单号</th>
                  <th>用户信息</th>
                  <th>商品信息</th>
                  <th>金额</th>
                  <th>状态</th>
                  <th>支付方式</th>
                  <th>创建时间</th>
                  <th width="180">操作</th>
                </tr>
              </thead>
              <tbody id="ordersTableBody"></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="orderDetailModal">
    <div class="modal-overlay" onclick="closeOrderModal()"></div>
    <div class="modal-content" style="max-width: 700px;">
      <div class="modal-header">
        <h3 class="modal-title">订单详情</h3>
        <button class="modal-close" onclick="closeOrderModal()">
          <i class="fa fa-times"></i>
        </button>
      </div>
      <div class="modal-body" id="orderDetailBody"></div>
      <div class="modal-footer" id="orderDetailFooter"></div>
    </div>
  </div>

  <script src="js/sidebar.js"></script>
  <script src="js/admin.js"></script>
  <script>
    if (!ensureAdminAuth()) {
      throw new Error('管理员未登录');
    }

    fillAdminName('.user-name');

    document.getElementById('logoutBtn').addEventListener('click', function(e) {
      e.preventDefault();
      adminLogout();
    });

    document.getElementById('userDropdown').addEventListener('click', function(e) {
      e.stopPropagation();
      document.getElementById('dropdownMenu').classList.toggle('show');
    });

    document.addEventListener('click', function() {
      document.getElementById('dropdownMenu').classList.remove('show');
    });

    let currentPage = 1;
    let pageSize = 10;
    let currentOrders = [];
    let currentOrder = null;
    const ORDER_STORAGE_KEY = 'zhimai_orders';

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJsSingleQuote(value) {
      return String(value ?? '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'");
    }

    function sanitizeImageUrl(value, fallback) {
      const raw = String(value || '').trim();
      if (!raw) return fallback;
      if (/^(https?:\/\/|data:image\/|\/|\.{1,2}\/)/i.test(raw)) {
        return raw;
      }
      return fallback;
    }

    function createActionButton(className, title, iconClass, onClick) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = className;
      btn.title = title;
      btn.addEventListener('click', onClick);
      const icon = document.createElement('i');
      icon.className = iconClass;
      btn.appendChild(icon);
      return btn;
    }

    function createLabeledRow(label, valueNodeOrText, options = {}) {
      const row = document.createElement('p');
      row.style.color = options.color || 'var(--text-gray)';
      row.style.marginBottom = options.marginBottom || '8px';

      const strong = document.createElement('strong');
      strong.textContent = `${label}：`;
      row.appendChild(strong);

      if (valueNodeOrText && typeof valueNodeOrText === 'object' && valueNodeOrText.nodeType) {
        row.appendChild(valueNodeOrText);
      } else {
        row.appendChild(document.createTextNode(String(valueNodeOrText ?? '--')));
      }
      return row;
    }

    function createPriceLine(label, value, valueStyle, withBottomBorder = false) {
      const line = document.createElement('div');
      line.style.display = 'flex';
      line.style.justifyContent = 'space-between';
      line.style.marginBottom = '8px';
      if (withBottomBorder) {
        line.style.paddingTop = '12px';
        line.style.borderTop = '1px solid rgba(255,255,255,0.1)';
        line.style.marginBottom = '0';
      }

      const left = document.createElement('span');
      left.style.color = 'var(--text-gray)';
      left.textContent = label;

      const right = document.createElement('span');
      right.style.cssText = valueStyle || 'color:#fff;';
      right.textContent = value;

      line.appendChild(left);
      line.appendChild(right);
      return line;
    }

    function getOrderStatusText(status) {
      const map = {
        pending: '待支付',
        paying: '支付中',
        paid: '待处理',
        failed: '支付失败',
        processing: '处理中',
        completed: '已完成',
        cancelled: '已取消',
        refunded: '已退款'
      };
      return map[status] || status || '--';
    }

    function getOrdersFromStorage() {
      try {
        const parsed = JSON.parse(localStorage.getItem(ORDER_STORAGE_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return [];
      }
    }

    function saveOrdersToStorage(orders) {
      localStorage.setItem(ORDER_STORAGE_KEY, JSON.stringify(orders));
    }

    function normalizeOrder(order) {
      const status = order.status || 'pending';
      const totalAmount = Number(order.totalAmount ?? order.amount ?? order.price ?? 0);
      const createdAt = order.createdAt || order.createTime || order.orderTime || new Date().toISOString();
      const id = String(order.id || order._id || order.orderId || order.orderNo || ('order_' + Date.now()));

      return {
        ...order,
        id,
        orderNo: order.orderNo || id,
        username: order.username || order.userName || order.nickname || '--',
        userId: order.userId || '--',
        userPhone: order.userPhone || order.contactPhone || '--',
        productName: order.productName || order.serviceName || '--',
        quantity: Number(order.quantity || 1),
        totalAmount,
        price: Number(order.price ?? totalAmount),
        status,
        statusText: order.statusText || getOrderStatusText(status),
        createdAt
      };
    }

    function updateOrderInStorage(orderId, patch) {
      const orders = getOrdersFromStorage();
      const index = orders.findIndex((o) => String(o.id || o._id || o.orderId || o.orderNo) === String(orderId));
      if (index === -1) {
        throw new Error('订单不存在');
      }
      orders[index] = {
        ...orders[index],
        ...patch,
        updatedAt: new Date().toISOString()
      };
      saveOrdersToStorage(orders);
    }

    async function loadOrders() {
      const filterStatus = document.getElementById('filterStatus').value;
      const filterOrderId = document.getElementById('filterOrderId').value.trim();
      const filterUser = document.getElementById('filterUser').value.trim();

      try {
        const allOrders = getOrdersFromStorage()
          .map(normalizeOrder)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        const orders = (!filterStatus || filterStatus === 'all')
          ? allOrders
          : allOrders.filter(order => order.status === filterStatus);

        currentOrders = orders.filter(order => {
          const orderNo = String(order.orderNo || order.id || '').toLowerCase();
          const username = String(order.username || '').toLowerCase();
          const userId = String(order.userId || '').toLowerCase();
          const userPhone = String(order.userPhone || '').toLowerCase();

          if (filterOrderId && !orderNo.includes(filterOrderId.toLowerCase())) return false;
          if (
            filterUser &&
            !username.includes(filterUser.toLowerCase()) &&
            !userId.includes(filterUser.toLowerCase()) &&
            !userPhone.includes(filterUser.toLowerCase())
          ) {
            return false;
          }

          return true;
        });

        updateStats(orders);
        renderTable();
      } catch (err) {
        console.error('加载订单失败:', err);
        showToast('加载订单失败: ' + err.message, 'error');
      }
    }

    function updateStats(orders) {
      document.getElementById('statPending').textContent = orders.filter(o => o.status === 'pending').length;
      document.getElementById('statPaid').textContent = orders.filter(o => o.status === 'paid').length;
      document.getElementById('statProcessing').textContent = orders.filter(o => o.status === 'processing').length;
      document.getElementById('statCompleted').textContent = orders.filter(o => o.status === 'completed').length;
    }

    function renderTable() {
      const tbody = document.getElementById('ordersTableBody');
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageOrders = currentOrders.slice(start, end);
      const paymentMap = { wechat: '微信', alipay: '支付宝', balance: '余额' };
      const orderNoColorMap = {
        pending: '#faad14',
        paid: '#1890ff',
        processing: 'var(--primary)',
        completed: '#52c41a',
        cancelled: 'var(--text-muted)'
      };

      tbody.textContent = '';

      if (pageOrders.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 8;
        td.style.textAlign = 'center';
        td.style.padding = '48px';
        td.textContent = '暂无订单';
        tr.appendChild(td);
        tbody.appendChild(tr);
        renderPagination();
        return;
      }

      pageOrders.forEach((order) => {
        const tr = document.createElement('tr');

        const tdOrderNo = document.createElement('td');
        const orderNoStrong = document.createElement('strong');
        orderNoStrong.style.color = orderNoColorMap[String(order.status || '').toLowerCase()] || 'var(--text-primary)';
        orderNoStrong.textContent = order.orderNo || order.id || '--';
        tdOrderNo.appendChild(orderNoStrong);
        tr.appendChild(tdOrderNo);

        const tdUser = document.createElement('td');
        const userNameDiv = document.createElement('div');
        userNameDiv.textContent = order.username || '--';
        const userContact = document.createElement('small');
        userContact.style.color = 'var(--text-gray)';
        userContact.textContent = order.userPhone || order.userId || '--';
        tdUser.appendChild(userNameDiv);
        tdUser.appendChild(userContact);
        tr.appendChild(tdUser);

        const tdProduct = document.createElement('td');
        const productWrap = document.createElement('div');
        productWrap.style.display = 'flex';
        productWrap.style.alignItems = 'center';
        productWrap.style.gap = '10px';
        const productImage = document.createElement('img');
        productImage.alt = '';
        productImage.src = sanitizeImageUrl(
          order.productImage,
          'https://via.placeholder.com/40x30/333/999?text=%E5%95%86%E5%93%81'
        );
        productImage.style.width = '40px';
        productImage.style.height = '30px';
        productImage.style.objectFit = 'cover';
        productImage.style.borderRadius = '4px';
        const productMeta = document.createElement('div');
        const productName = document.createElement('div');
        const rawProductName = String(order.productName || '--');
        productName.textContent = rawProductName.length > 20
          ? `${rawProductName.substring(0, 20)}...`
          : rawProductName;
        const productQty = document.createElement('small');
        productQty.style.color = 'var(--text-gray)';
        productQty.textContent = `x${order.quantity || 1}`;
        productMeta.appendChild(productName);
        productMeta.appendChild(productQty);
        productWrap.appendChild(productImage);
        productWrap.appendChild(productMeta);
        tdProduct.appendChild(productWrap);
        tr.appendChild(tdProduct);

        const tdAmount = document.createElement('td');
        tdAmount.className = 'price';
        tdAmount.textContent = `¥${Number(order.totalAmount || order.price || 0).toFixed(2)}`;
        tr.appendChild(tdAmount);

        const tdStatus = document.createElement('td');
        const statusBadge = document.createElement('span');
        statusBadge.className = `status-badge ${String(order.status || '').replace(/[^\w-]/g, '')}`;
        statusBadge.textContent = order.statusText || '--';
        tdStatus.appendChild(statusBadge);
        tr.appendChild(tdStatus);

        const tdPayment = document.createElement('td');
        tdPayment.textContent = paymentMap[order.paymentMethod] || '--';
        tr.appendChild(tdPayment);

        const tdCreatedAt = document.createElement('td');
        tdCreatedAt.textContent = new Date(order.createdAt).toLocaleString('zh-CN');
        tr.appendChild(tdCreatedAt);

        const tdActions = document.createElement('td');
        tdActions.appendChild(createActionButton('btn-icon btn-edit', '查看详情', 'fa fa-eye', () => viewOrderDetail(order.id)));
        if (order.status === 'paid') {
          tdActions.appendChild(createActionButton('btn-icon btn-primary', '开始处理', 'fa fa-play', () => startProcess(order.id)));
        }
        if (order.status === 'processing') {
          tdActions.appendChild(createActionButton('btn-icon btn-success', '完成订单', 'fa fa-check', () => completeOrder(order.id)));
        }
        if (['pending', 'paid'].includes(order.status)) {
          tdActions.appendChild(createActionButton('btn-icon danger', '取消订单', 'fa fa-times', () => cancelOrder(order.id)));
        }
        tr.appendChild(tdActions);

        tbody.appendChild(tr);
      });

      renderPagination();
    }

    function viewOrderDetail(orderId) {
      currentOrder = currentOrders.find(order => (order.id || order._id) === orderId);
      if (!currentOrder) return;

      const paymentMap = { wechat: '微信支付', alipay: '支付宝支付', balance: '余额支付' };
      const bodyEl = document.getElementById('orderDetailBody');
      const footerEl = document.getElementById('orderDetailFooter');

      bodyEl.textContent = '';
      footerEl.textContent = '';

      const topGrid = document.createElement('div');
      topGrid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;';

      const orderInfoCol = document.createElement('div');
      const orderTitle = document.createElement('h4');
      orderTitle.style.cssText = 'color:#fff;margin-bottom:12px;';
      orderTitle.textContent = '订单信息';
      orderInfoCol.appendChild(orderTitle);
      orderInfoCol.appendChild(createLabeledRow('订单号', currentOrder.orderNo || currentOrder.id || '--'));

      const statusBadge = document.createElement('span');
      statusBadge.className = `status-badge ${String(currentOrder.status || '').replace(/[^\w-]/g, '')}`;
      statusBadge.textContent = currentOrder.statusText || '--';
      orderInfoCol.appendChild(createLabeledRow('订单状态', statusBadge));
      orderInfoCol.appendChild(createLabeledRow('创建时间', new Date(currentOrder.createdAt).toLocaleString('zh-CN')));
      orderInfoCol.appendChild(createLabeledRow('支付方式', paymentMap[currentOrder.paymentMethod] || '--', { marginBottom: '0' }));

      const userInfoCol = document.createElement('div');
      const userTitle = document.createElement('h4');
      userTitle.style.cssText = 'color:#fff;margin-bottom:12px;';
      userTitle.textContent = '用户信息';
      userInfoCol.appendChild(userTitle);
      userInfoCol.appendChild(createLabeledRow('用户ID', currentOrder.userId || '--'));
      userInfoCol.appendChild(createLabeledRow('用户名', currentOrder.username || '--'));
      userInfoCol.appendChild(createLabeledRow('游戏账号', currentOrder.gameAccount || '--'));
      userInfoCol.appendChild(createLabeledRow('游戏服务器', currentOrder.gameServer || '--'));
      userInfoCol.appendChild(createLabeledRow('联系电话', currentOrder.contactPhone || currentOrder.userPhone || '--'));
      if (currentOrder.contactSocial) {
        userInfoCol.appendChild(createLabeledRow('QQ/微信', currentOrder.contactSocial, { marginBottom: '0' }));
      }

      topGrid.appendChild(orderInfoCol);
      topGrid.appendChild(userInfoCol);
      bodyEl.appendChild(topGrid);

      const productCard = document.createElement('div');
      productCard.style.cssText = 'background:rgba(255,255,255,0.02);border-radius:8px;padding:16px;margin-bottom:24px;';
      const productTitle = document.createElement('h4');
      productTitle.style.cssText = 'color:#fff;margin-bottom:12px;';
      productTitle.textContent = '商品信息';
      productCard.appendChild(productTitle);

      const productWrap = document.createElement('div');
      productWrap.style.cssText = 'display:flex;gap:16px;align-items:center;';
      const productImg = document.createElement('img');
      productImg.alt = '';
      productImg.src = sanitizeImageUrl(
        currentOrder.productImage,
        'https://via.placeholder.com/80x60/333/999?text=%E5%95%86%E5%93%81'
      );
      productImg.style.cssText = 'width:80px;height:60px;object-fit:cover;border-radius:8px;';

      const productMeta = document.createElement('div');
      productMeta.style.flex = '1';
      const productName = document.createElement('p');
      productName.style.cssText = 'color:#fff;margin-bottom:4px;';
      productName.textContent = currentOrder.productName || '--';
      const productPrice = document.createElement('p');
      productPrice.style.cssText = 'color:var(--text-gray);font-size:14px;';
      productPrice.textContent = `单价：¥${Number(currentOrder.price || 0).toFixed(2)} x ${currentOrder.quantity || 1}`;
      productMeta.appendChild(productName);
      productMeta.appendChild(productPrice);
      productWrap.appendChild(productImg);
      productWrap.appendChild(productMeta);
      productCard.appendChild(productWrap);
      bodyEl.appendChild(productCard);

      const priceCard = document.createElement('div');
      priceCard.style.cssText = 'background:rgba(108,99,255,0.05);border-radius:8px;padding:16px;';
      const priceTitle = document.createElement('h4');
      priceTitle.style.cssText = 'color:#fff;margin-bottom:12px;';
      priceTitle.textContent = '价格明细';
      priceCard.appendChild(priceTitle);
      priceCard.appendChild(createPriceLine('商品金额', `¥${Number(currentOrder.subtotal || currentOrder.totalAmount || 0).toFixed(2)}`));
      priceCard.appendChild(createPriceLine('优惠抵扣', `-¥${Number(currentOrder.discount || 0).toFixed(2)}`, 'color:#52c41a;'));
      priceCard.appendChild(createPriceLine(
        '实付金额',
        `¥${Number(currentOrder.totalAmount || 0).toFixed(2)}`,
        'color:var(--primary);font-size:20px;font-weight:700;',
        true
      ));
      bodyEl.appendChild(priceCard);

      if (currentOrder.remark) {
        const remarkCard = document.createElement('div');
        remarkCard.style.cssText = 'margin-top:16px;padding:12px;background:rgba(250,173,20,0.05);border-radius:8px;border-left:3px solid #faad14;';
        const remarkText = document.createElement('p');
        remarkText.style.cssText = 'color:#faad14;font-size:14px;';
        const remarkIcon = document.createElement('i');
        remarkIcon.className = 'fa fa-info-circle';
        remarkText.appendChild(remarkIcon);
        remarkText.appendChild(document.createTextNode(' 用户备注：' + (currentOrder.remark || '--')));
        remarkCard.appendChild(remarkText);
        bodyEl.appendChild(remarkCard);
      }

      const closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.className = 'btn btn-outline';
      closeBtn.textContent = '关闭';
      closeBtn.addEventListener('click', closeOrderModal);
      footerEl.appendChild(closeBtn);

      if (currentOrder.status === 'paid') {
        const processBtn = document.createElement('button');
        processBtn.type = 'button';
        processBtn.className = 'btn btn-primary';
        processBtn.textContent = '开始处理';
        processBtn.addEventListener('click', () => {
          startProcess(currentOrder.id);
          closeOrderModal();
        });
        footerEl.appendChild(processBtn);
      } else if (currentOrder.status === 'processing') {
        const completeBtn = document.createElement('button');
        completeBtn.type = 'button';
        completeBtn.className = 'btn btn-success';
        completeBtn.textContent = '完成订单';
        completeBtn.addEventListener('click', () => {
          completeOrder(currentOrder.id);
          closeOrderModal();
        });
        footerEl.appendChild(completeBtn);
      }

      if (['pending', 'paid'].includes(currentOrder.status)) {
        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'btn btn-danger';
        cancelBtn.textContent = '取消订单';
        cancelBtn.addEventListener('click', () => {
          cancelOrder(currentOrder.id);
          closeOrderModal();
        });
        footerEl.appendChild(cancelBtn);
      }

      document.getElementById('orderDetailModal').classList.add('active');
    }

    function closeOrderModal() {
      document.getElementById('orderDetailModal').classList.remove('active');
    }

    function startProcess(orderId) {
      if (confirm('确认开始处理该订单吗？')) {
        updateOrderStatus(orderId, 'processing', '订单已开始处理');
      }
    }

    function completeOrder(orderId) {
      if (confirm('确认完成该订单吗？')) {
        updateOrderStatus(orderId, 'completed', '订单已完成');
      }
    }

    function cancelOrder(orderId) {
      if (confirm('确认取消该订单吗？')) {
        cancelOrderRequest(orderId);
      }
    }

    async function updateOrderStatus(orderId, status, successMessage) {
      try {
        updateOrderInStorage(orderId, {
          status,
          statusText: getOrderStatusText(status)
        });
        showToast(successMessage, 'success');
        await loadOrders();
      } catch (err) {
        showToast('更新订单失败: ' + err.message, 'error');
      }
    }

    async function cancelOrderRequest(orderId) {
      try {
        updateOrderInStorage(orderId, {
          status: 'cancelled',
          statusText: getOrderStatusText('cancelled'),
          cancelReason: '管理员取消'
        });
        showToast('订单已取消', 'success');
        await loadOrders();
      } catch (err) {
        showToast('取消订单失败: ' + err.message, 'error');
      }
    }

    function exportOrders() {
      showToast('导出功能开发中', 'info');
    }

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      const icon = document.createElement('i');
      icon.className = `fa fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'times-circle' : 'info-circle'}`;
      toast.appendChild(icon);
      toast.appendChild(document.createTextNode(` ${message}`));
      toast.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: ${type === 'success' ? '#52c41a' : type === 'error' ? '#ff4d4f' : '#1890ff'};
        color: #fff;
        padding: 12px 20px;
        border-radius: 4px;
        z-index: 9999;
        animation: slideIn 0.3s ease;
      `;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }

    function filterByStatus(status) {
      document.getElementById('filterStatus').value = status;
      currentPage = 1;
      loadOrders();
    }

    function applyFilter() {
      currentPage = 1;
      loadOrders();
    }

    function resetFilter() {
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterOrderId').value = '';
      document.getElementById('filterUser').value = '';
      currentPage = 1;
      loadOrders();
    }

    function renderPagination() {
      const totalPages = Math.ceil(currentOrders.length / pageSize);
      const pagination = document.getElementById('pagination');
      pagination.textContent = '';

      if (totalPages <= 1) {
        return;
      }

      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.textContent = '上一页';
      prevBtn.disabled = currentPage === 1;
      prevBtn.addEventListener('click', () => gotoPage(currentPage - 1));
      pagination.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        pageBtn.textContent = String(i);
        pageBtn.addEventListener('click', () => gotoPage(i));
        pagination.appendChild(pageBtn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.textContent = '下一页';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.addEventListener('click', () => gotoPage(currentPage + 1));
      pagination.appendChild(nextBtn);
    }

    function gotoPage(page) {
      currentPage = page;
      renderTable();
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadOrders();
    });
  </script>
</body>
</html>
