<!-- 
  文件名: profile.html
  页面名称: 个人中心/我的
  功能说明: 用户个人中心，左侧菜单 + 右侧内容Tab切换
  包含：概览、我的订单、我的钱包、优惠券、消息通知、账号设置、安全中心
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人中心 - 织麦电竞</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- 腾讯云 CloudBase SDK -->
  <style>
    :root {
      --section-gap: 24px;
      --block-gap: 16px;
    }

    .profile-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
    }
    .profile-navbar .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
    }
    .profile-navbar .logo-icon { font-size: 22px; }
    .profile-navbar .logo-text { font-size: 18px; font-weight: 700; color: #fff; }
    .profile-navbar .logo-text em { color: var(--primary, #7c6bf0); font-style: normal; }
    #profileToastContainer {
      position: fixed;
      top: 88px;
      left: 50%;
      transform: translateX(-50%);
      width: min(calc(100vw - 24px), 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10050;
      pointer-events: none;
    }
    .profile-toast {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(calc(100vw - 24px), 360px);
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(124, 107, 240, 0.24);
      background: linear-gradient(135deg, rgba(10, 14, 28, 0.92), rgba(23, 32, 64, 0.9));
      backdrop-filter: blur(14px);
      color: #f8faff;
      box-shadow: 0 18px 44px rgba(4, 8, 22, 0.42), 0 0 24px rgba(91, 132, 255, 0.12);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-16px);
      transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s ease;
    }
    .profile-toast i {
      flex-shrink: 0;
    }
    .profile-toast.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .profile-toast.is-exit {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-16px);
    }
    .profile-toast-icon {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(124, 107, 240, 0.18);
      color: #9ea7ff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    .profile-toast-copy {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 0.01em;
    }
    .profile-toast-success .profile-toast-icon {
      background: rgba(82, 196, 26, 0.14);
      color: #95de64;
    }
    .profile-toast-error {
      border-color: rgba(255, 77, 79, 0.22);
      box-shadow: 0 18px 44px rgba(4, 8, 22, 0.42), 0 0 22px rgba(255, 77, 79, 0.12);
    }
    .profile-toast-error .profile-toast-icon {
      background: rgba(255, 77, 79, 0.16);
      color: #ff9c9e;
    }
    .profile-toast-info {
      border-color: rgba(64, 169, 255, 0.22);
      box-shadow: 0 18px 44px rgba(4, 8, 22, 0.42), 0 0 22px rgba(64, 169, 255, 0.12);
    }
    .profile-toast-info .profile-toast-icon {
      background: rgba(64, 169, 255, 0.16);
      color: #8fd3ff;
    }
    .profile-tab-body {
      padding: var(--block-gap) 32px 32px;
      display: flex;
      flex-direction: column;
      gap: var(--section-gap);
    }
    .profile-section {
      display: flex;
      flex-direction: column;
      gap: var(--block-gap);
    }
    .profile-section-title {
      margin: 0;
    }
    .profile-tab-body .notification-list,
    .profile-tab-body .security-list,
    .profile-tab-body .coupon-grid,
    .profile-tab-body .form-section {
      padding: 0;
    }
    
    /* 返回按钮定位 */
    .profile-navbar {
      justify-content: space-between;
    }

    .profile-page {
      padding-top: 24px;
      min-height: 100vh;
      background: var(--bg-dark);
    }
    .profile-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    
    /* 用户信息卡片 - 优化版 */
    .user-card {
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.15) 0%, rgba(0, 212, 255, 0.08) 50%, rgba(108, 99, 255, 0.05) 100%);
      border-radius: 24px;
      padding: 40px;
      margin-bottom: 32px;
      border: 1px solid rgba(108, 99, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 28px;
      position: relative;
      overflow: hidden;
    }
    .user-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(108, 99, 255, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .user-avatar-large {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #fff;
      font-weight: 700;
      border: 3px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 32px rgba(108, 99, 255, 0.3);
      position: relative;
      z-index: 1;
    }
    .user-info {
      flex: 1;
      position: relative;
      z-index: 1;
    }
    .user-name {
      font-size: 22px;
      color: #fff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    .user-id {
      font-size: 13px;
      color: var(--text-gray);
      margin-bottom: 14px;
      font-family: monospace;
    }
    .user-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .user-badge {
      padding: 5px 12px;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .user-badge.vip {
      background: linear-gradient(135deg, #f0f0f0, #d0d0d0);
      color: #444;
      font-weight: 600;
      border: none;
    }
    .user-stats {
      display: flex;
      gap: 40px;
      position: relative;
      z-index: 1;
    }
    .user-stat {
      text-align: center;
      padding: 8px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      min-width: 70px;
    }
    .user-stat .value {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }
    .user-stat .label {
      font-size: 12px;
      color: var(--text-gray);
    }
    
    /* 主布局 - 优化版 */
    .profile-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 28px;
    }
    
    /* 左侧菜单 - 优化版 */
    .profile-menu {
      background: rgba(255,255,255,0.02);
      border-radius: 20px;
      padding: 20px 16px;
      border: 1px solid rgba(255,255,255,0.06);
      height: fit-content;
      position: sticky;
      top: 100px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 12px;
      color: var(--text-gray);
      cursor: pointer;
      transition: all 0.25s ease;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
    }
    .menu-item:hover {
      background: rgba(255,255,255,0.06);
      color: #fff;
      transform: translateX(4px);
    }
    .menu-item.active {
      background: linear-gradient(135deg, var(--primary), rgba(108,99,255,0.8));
      color: #fff;
      box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
    }
    .menu-item i {
      width: 22px;
      text-align: center;
      font-size: 16px;
    }
    .menu-divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 16px 0;
    }
    .menu-item.danger {
      color: #ff6b6b;
    }
    .menu-item.danger:hover {
      background: rgba(255, 107, 107, 0.1);
      color: #ff6b6b;
    }
    .menu-badge {
      margin-left: auto;
      background: linear-gradient(135deg, #ff6b6b, #ff4757);
      color: #fff;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 600;
      min-width: 22px;
      text-align: center;
    }
    
    /* 右侧内容 - 优化版 */
    .profile-content {
      background: rgba(255,255,255,0.02);
      border-radius: 20px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.06);
      min-height: 600px;
      overflow: hidden;
    }
    
    /* 内容头部 - 优化版 */
    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 32px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.01);
    }
    .content-title {
      font-size: 18px;
      color: #fff;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .content-title::before {
      content: '';
      width: 4px;
      height: 20px;
      background: linear-gradient(180deg, var(--primary), var(--accent));
      border-radius: 2px;
    }
    .content-title .count {
      color: var(--text-gray);
      font-weight: 400;
      margin-left: 4px;
      font-size: 14px;
    }
    
    /* 状态筛选标签 */
    .status-tabs {
      display: flex;
      gap: 8px;
      padding: 16px 32px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      overflow-x: auto;
    }
    .status-tab {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-gray);
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .status-tab:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }
    .status-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    
    /* 订单列表 - 优化版 */
    .order-list {
      padding: 0 32px 32px;
    }
    .order-card {
      background: rgba(255,255,255,0.02);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.3s ease;
    }
    .order-card:hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(108, 99, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .order-id {
      font-size: 13px;
      color: var(--text-gray);
      font-family: monospace;
    }
    .order-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .order-status.pending {
      background: rgba(250, 173, 20, 0.1);
      color: #faad14;
    }
    .order-status.paid {
      background: rgba(24, 144, 255, 0.1);
      color: #1890ff;
    }
    .order-status.processing {
      background: rgba(108, 99, 255, 0.1);
      color: var(--primary);
    }
    .order-status.completed {
      background: rgba(82, 196, 26, 0.1);
      color: #52c41a;
    }
    .order-status.cancelled {
      background: rgba(255, 77, 79, 0.1);
      color: #ff4d4f;
    }
    .order-body {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .order-image {
      width: 80px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      background: rgba(255,255,255,0.05);
    }
    .order-info {
      flex: 1;
    }
    .order-name {
      font-size: 15px;
      color: #fff;
      margin-bottom: 6px;
    }
    .order-meta {
      font-size: 12px;
      color: var(--text-gray);
    }
    .order-countdown {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(250, 173, 20, 0.12);
      color: #faad14;
      font-size: 12px;
      font-weight: 500;
    }
    .order-price {
      font-size: 18px;
      font-weight: 600;
      color: var(--primary);
    }
    .order-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: flex-end;
    }
    .order-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
    }
    .order-btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .order-btn-primary:hover {
      background: var(--primary-light);
    }
    .order-btn-outline {
      background: rgba(255,255,255,0.05);
      color: var(--text-gray);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .order-btn-outline:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    
    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
    }
    .empty-state i {
      font-size: 64px;
      color: rgba(255,255,255,0.1);
      margin-bottom: 16px;
    }
    .empty-state p {
      color: var(--text-gray);
      font-size: 14px;
    }
    
    /* 概览网格 */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      padding: 24px 32px;
    }
    .overview-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 12px;
      overflow: hidden;
    }
    .overview-card.full-width {
      grid-column: 1 / -1;
    }
    .overview-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .overview-card-title {
      font-size: 14px;
      color: #fff;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .overview-card-title i {
      color: var(--primary);
    }
    .overview-card-more {
      font-size: 12px;
      color: var(--text-gray);
      cursor: pointer;
      transition: color 0.3s;
    }
    .overview-card-more:hover {
      color: var(--primary);
    }
    .overview-card-body {
      padding: 0;
    }
    
    /* 钱包卡片 - 优化版 */
    .wallet-card {
      background: linear-gradient(135deg, rgba(250, 173, 20, 0.12) 0%, rgba(255, 122, 69, 0.08) 100%);
      border: 1px solid rgba(250, 173, 20, 0.15);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .wallet-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(250, 173, 20, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .wallet-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(250, 173, 20, 0.15);
      border-color: rgba(250, 173, 20, 0.25);
    }
    .wallet-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .wallet-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .wallet-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .wallet-card:hover .wallet-arrow {
      background: rgba(255,255,255,0.15);
      color: #fff;
      transform: translateX(4px);
    }
    .wallet-icon {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #faad14;
    }
    .wallet-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .wallet-label {
      font-size: 13px;
      color: var(--text-gray);
    }
    .wallet-amount {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
    }
    .wallet-actions {
      display: flex;
      gap: 8px;
    }
    .wallet-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
    }
    .wallet-btn-primary {
      background: #faad14;
      color: #000;
    }
    .wallet-btn-primary:hover {
      background: #ffc53d;
    }
    .wallet-btn-outline {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .wallet-btn-outline:hover {
      background: rgba(255,255,255,0.2);
    }
    
    /* 信息提醒 */
    .info-alert {
      background: linear-gradient(135deg, rgba(250, 173, 20, 0.1), rgba(255, 107, 53, 0.05));
      border: 1px solid rgba(250, 173, 20, 0.2);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .info-alert:hover {
      background: linear-gradient(135deg, rgba(250, 173, 20, 0.15), rgba(255, 107, 53, 0.1));
    }
    .info-alert-icon {
      width: 40px;
      height: 40px;
      background: rgba(250, 173, 20, 0.15);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #faad14;
      font-size: 18px;
    }
    .info-alert-content {
      flex: 1;
    }
    .info-alert-title {
      font-size: 14px;
      color: #fff;
      font-weight: 500;
    }
    .info-alert-desc {
      font-size: 12px;
      color: var(--text-gray);
      margin-top: 2px;
    }
    .info-alert-arrow {
      color: var(--text-gray);
    }
    
    /* 小列表项 */
    .mini-list-item {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      cursor: pointer;
      transition: all 0.3s;
    }
    .mini-list-item:last-child {
      border-bottom: none;
    }
    .mini-list-item:hover {
      background: rgba(255,255,255,0.02);
    }
    .mini-list-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(108, 99, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 14px;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .mini-list-content {
      flex: 1;
      min-width: 0;
    }
    .mini-list-title {
      font-size: 13px;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-list-meta {
      font-size: 11px;
      color: var(--text-gray);
    }
    .mini-list-arrow {
      color: var(--text-gray);
      font-size: 12px;
    }
    
    /* 优惠券卡片 */
    .coupon-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 24px 32px;
    }
    .coupon-card {
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.1), rgba(0, 212, 255, 0.05));
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(108, 99, 255, 0.15);
      position: relative;
    }
    .coupon-card::before {
      content: '';
      position: absolute;
      top: 0;

function escapeHTML(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeJsSingleQuote(value) {
  return String(value == null ? '' : value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function encodeSafeId(value) {
  return encodeURIComponent(String(value == null ? '' : value));
}

function decodeSafeId(value) {
  const text = String(value == null ? '' : value);
  try {
    return decodeURIComponent(text);
  } catch (error) {
    return text;
  }
}

function setRedirectAfterLogin(target = `${window.location.pathname}${window.location.search}${window.location.hash}`) {
  try {
    const safeTarget = sanitizeInternalTarget(target, '');
    if (safeTarget) {
      sessionStorage.setItem('redirect_after_login', safeTarget);
    }
  } catch (error) {}
}

function sanitizeInternalTarget(target, fallback = '') {
  const raw = String(target || '').trim();
  if (!raw || raw.includes('\n') || raw.includes('\r')) {
    return fallback;
  }

  try {
    const resolved = new URL(raw, window.location.href);
    if (!/^https?:$/i.test(resolved.protocol)) {
      return fallback;
    }
    if (resolved.origin !== window.location.origin) {
      return fallback;
    }
    return `${resolved.pathname}${resolved.search}${resolved.hash}` || fallback;
  } catch (error) {
    return fallback;
  }
}

function sanitizeImageUrl(value, fallback = 'https://via.placeholder.com/80x60/333/666?text=Game') {
  const raw = String(value || '').trim();
  if (!raw) return fallback;

  if (/^data:image\//i.test(raw) || /^blob:/i.test(raw) || /^https?:\/\//i.test(raw) || raw.startsWith('./') || raw.startsWith('../') || raw.startsWith('/')) {
    return raw;
  }

  return fallback;
}

function normalizeOrderStatusClass(status) {

  const normalized = String(status || '').trim();
  return allowed.has(normalized) ? normalized : 'pending';

function createPasswordSalt() {
  if (typeof window !== 'undefined' && window.crypto && typeof window.crypto.getRandomValues === 'function') {
    const randomBytes = new Uint8Array(16);
    window.crypto.getRandomValues(randomBytes);
    return Array.from(randomBytes, (item) => item.toString(16).padStart(2, '0')).join('');
  }

  return `${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
}

function derivePasswordHash(password, salt) {
  const text = `${String(password || '')}::${String(salt || '')}`;
  let h1 = 0xdeadbeef ^ text.length;
  let h2 = 0x41c6ce57 ^ text.length;
  let h3 = 0xc0decafe ^ text.length;
  let h4 = 0x9e3779b9 ^ text.length;

  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ code, 2654435761);
    h2 = Math.imul(h2 ^ code, 1597334677);
    h3 = Math.imul(h3 ^ code, 2246822507);
    h4 = Math.imul(h4 ^ code, 3266489909);
  }

  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h3 ^ (h3 >>> 13), 3266489909);
  h3 = Math.imul(h3 ^ (h3 >>> 16), 2246822507) ^ Math.imul(h4 ^ (h4 >>> 13), 3266489909);
  h4 = Math.imul(h4 ^ (h4 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);

  return [h1, h2, h3, h4]
    .map((item) => (`00000000${(item >>> 0).toString(16)}`).slice(-8))
    .join('');
}

function getOrderStatusText(status) {
  const statusMap = {
    pending: '待支付',
    paid: '已支付',
    processing: '处理中',
    completed: '已完成',
    cancelled: '已取消'
  };

  return statusMap[status] || '未知状态';
}

function getOrderExpireAt(order) {
  const expireAt = new Date(order.expireAt || '').getTime();
  if (Number.isFinite(expireAt)) {
    return expireAt;
  }

  const createdAt = new Date(order.createdAt || '').getTime();
  if (!Number.isFinite(createdAt)) {
    return Date.now() + PENDING_ORDER_TIMEOUT_MS;
  }

  return createdAt + PENDING_ORDER_TIMEOUT_MS;
}

function formatOrderCountdown(remainingMs) {
  const totalSeconds = Math.max(0, Math.ceil(remainingMs / 1000));
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

function syncPendingOrderTimers() {
  const orders = JSON.parse(localStorage.getItem('zhimai_orders') || '[]');
  const now = Date.now();
  let changed = false;
  let expiredCount = 0;

  const nextOrders = orders.map(order => {
    const nextOrder = { ...order };
    const expectedStatusText = getOrderStatusText(nextOrder.status);

    if (nextOrder.statusText !== expectedStatusText) {
      nextOrder.statusText = expectedStatusText;
      changed = true;
    }

    if (nextOrder.status !== 'pending') {
      return nextOrder;
    }

    let createdAt = new Date(nextOrder.createdAt || '').getTime();
    if (!Number.isFinite(createdAt)) {
      createdAt = now;
      nextOrder.createdAt = new Date(createdAt).toISOString();
      changed = true;
    }

    const expireAt = getOrderExpireAt(nextOrder);
    if (nextOrder.expireAt !== new Date(expireAt).toISOString()) {
      nextOrder.expireAt = new Date(expireAt).toISOString();
      changed = true;
    }

    if (now >= expireAt) {
      nextOrder.status = 'cancelled';
      nextOrder.statusText = '已取消';
      nextOrder.expiredAt = new Date(now).toISOString();
      nextOrder.cancelReason = nextOrder.cancelReason || '订单超时未支付';
      expiredCount += 1;
      changed = true;
    }

    return nextOrder;
  });

  if (changed) {
    localStorage.setItem('zhimai_orders', JSON.stringify(nextOrders));
  }

  return {
    orders: nextOrders,
    expiredCount
  };
}

function refreshOrderCountdowns() {
  const { orders, expiredCount } = syncPendingOrderTimers();
  const userOrders = new Map(
    orders
      .filter(order => order.userId === currentUser.id && order.status === 'pending')
      .map(order => [order.id, order])
  );

  document.querySelectorAll('[data-order-countdown]').forEach(node => {
    const order = userOrders.get(node.dataset.orderId);
    if (!order) {
      return;
    }

    const countdownText = node.querySelector('[data-countdown-text]');
    if (!countdownText) {
      return;
    }

    countdownText.textContent = formatOrderCountdown(getOrderExpireAt(order) - Date.now());
  });

  return expiredCount;
}

function startOrderCountdownTimer() {
  if (currentTab !== 'orders') {
    return;
  }

  refreshOrderCountdowns();
  orderCountdownTimer = setInterval(() => {
    const expiredCount = refreshOrderCountdowns();
    if (expiredCount > 0 && currentTab === 'orders') {
      loadContent('orders');
    }
  }, 1000);
}

function stopOrderCountdownTimer() {
  if (!orderCountdownTimer) {
    return;
  }

  clearInterval(orderCountdownTimer);
  orderCountdownTimer = null;
}

        const safeIcon = notif.type === 'order' ? 'fa-shopping-bag' : 'fa-bell';
        const safeTitle = escapeHTML(notif.title || '');
        const safeContent = escapeHTML(notif.content || '');
        const safeTime = escapeHTML(new Date(notif.createdAt).toLocaleString('zh-CN'));
        const safeTarget = sanitizeInternalTarget(notif.link, '');
        const safeActionAttr = safeTarget ? ` onclick="openNotificationLink('${escapeJsSingleQuote(safeTarget)}')"` : '';
        return `
        <div class="notification-item ${safeItemClass}"${safeActionAttr}>
          <div class="notification-icon">
            <i class="fa ${safeIcon}"></i>
          </div>
          <div class="notification-content">
            <div class="notification-title">${safeTitle}</div>
            <div class="notification-text">${safeContent}</div>
            <div class="notification-time">${safeTime}</div>

        </div>
      `;
      }).join('')}
      </div>
    </div>
  `;
}

function resetSecurityActionState() {
  if (securityPaymentCodeCountdownTimer) {
    clearInterval(securityPaymentCodeCountdownTimer);
    securityPaymentCodeCountdownTimer = null;
  }
  if (securityVerificationCodeCountdownTimer) {
    clearInterval(securityVerificationCodeCountdownTimer);
    securityVerificationCodeCountdownTimer = null;
  }
  if (securityOldPhoneCodeCountdownTimer) {
    clearInterval(securityOldPhoneCodeCountdownTimer);
    securityOldPhoneCodeCountdownTimer = null;
  }
  if (securityNewPhoneCodeCountdownTimer) {
    clearInterval(securityNewPhoneCodeCountdownTimer);
    securityNewPhoneCodeCountdownTimer = null;
  }

  securityActionState = {
    mode: '',
    verified: false,
    verificationCode: '',
    codeExpiresAt: 0,
    verificationCodeCooldownExpiresAt: 0,
    paymentMode: 'setup',
    paymentVerified: false,
    paymentCode: '',
    paymentCodeExpiresAt: 0,
    paymentCodeCooldownExpiresAt: 0,
    oldPhoneVerified: false,
    oldPhoneCode: '',
    oldPhoneCodeExpiresAt: 0,
    oldPhoneCodeCooldownExpiresAt: 0,
    newPhoneCode: '',
    newPhoneCodeExpiresAt: 0,
    newPhoneCodeCooldownExpiresAt: 0,
    message: '',
    messageType: ''
  };
}

function openSecurityActionPanel(mode) {
  resetSecurityActionState();
  const normalizedMode = mode === 'payment-password' ? 'paymentPassword' : mode;
  securityActionState.mode = normalizedMode;
  if (normalizedMode === 'paymentPassword') {
    securityActionState.paymentMode = hasWalletPaymentPassword() ? 'change' : 'setup';
  }
  loadContent('security');
}

function closeSecurityActionPanel() {
  resetSecurityActionState();
  loadContent('security');
}

function setSecurityMessage(elementId, message, type = '') {
  const node = document.getElementById(elementId);
  if (!node) {
    return;
  }

  node.textContent = message || '';
  node.className = type ? `security-message ${type}` : 'security-message';
}

function getSecurityVerificationCodeCooldownSeconds() {
  const expiresAt = Number(securityActionState.verificationCodeCooldownExpiresAt || 0);
  if (expiresAt <= 0) {
    return 0;
  }
  return Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
}

function updateSecurityVerificationSendButton() {
  const sendButton = document.getElementById('securityVerifySendBtn');
  if (!sendButton) {
    return;
  }

  const remainSeconds = getSecurityVerificationCodeCooldownSeconds();
  if (remainSeconds > 0) {
    sendButton.disabled = true;
    sendButton.textContent = `${remainSeconds}s`;
  } else {
    sendButton.disabled = false;
    sendButton.textContent = '发送验证码';
    if (securityVerificationCodeCountdownTimer) {
      clearInterval(securityVerificationCodeCountdownTimer);
      securityVerificationCodeCountdownTimer = null;
    }
  }
}

function startSecurityVerificationCodeCountdown() {
  if (securityVerificationCodeCountdownTimer) {
    clearInterval(securityVerificationCodeCountdownTimer);
    securityVerificationCodeCountdownTimer = null;
  }

  updateSecurityVerificationSendButton();
  if (getSecurityVerificationCodeCooldownSeconds() <= 0) {
    return;
  }

  securityVerificationCodeCountdownTimer = setInterval(() => {
    updateSecurityVerificationSendButton();
  }, 1000);
}

function sendSecurityVerificationCode() {
  setSecurityMessage('securityVerifyMessage', '功能未开放', 'info');
  return;
  const cooldownSeconds = getSecurityVerificationCodeCooldownSeconds();
  if (cooldownSeconds > 0) {
    setSecurityMessage('securityVerifyMessage', `请 ${cooldownSeconds}s 后再发送验证码。`, 'error');
    updateSecurityVerificationSendButton();
    return;
  }

  securityActionState.verificationCode = String(Math.floor(100000 + Math.random() * 900000));
  securityActionState.codeExpiresAt = Date.now() + 5 * 60 * 1000;
  securityActionState.verificationCodeCooldownExpiresAt = Date.now() + 60 * 1000;
  securityActionState.verified = false;

  // TODO(production): 接入真实短信服务后，必须移除前端明文展示验证码。
  securityActionState.message = `验证码：${securityActionState.verificationCode}（5 分钟内有效）`;
  securityActionState.messageType = 'success';
  setSecurityMessage('securityVerifyMessage', securityActionState.message, securityActionState.messageType);
  startSecurityVerificationCodeCountdown();
}

function validateSecurityVerificationCodeInput() {
  const codeInput = document.getElementById('securityVerifyCode');
  const code = codeInput ? codeInput.value.trim() : '';

  if (!/^\d{6}$/.test(code)) {
    return {
      ok: false,
      message: '请输入 6 位短信验证码。',
      focusTarget: codeInput
    };
  }

  if (!securityActionState.verificationCode || Date.now() > securityActionState.codeExpiresAt) {
    return {
      ok: false,
      message: '验证码已失效，请重新发送验证码。',
      focusTarget: codeInput
    };
  }

  if (code !== securityActionState.verificationCode) {
    return {
      ok: false,
      message: '验证码不正确，请重新输入。',
      focusTarget: codeInput
    };
  }

  return { ok: true };
}

function verifySecurityPhoneCode() {
  const validation = validateSecurityVerificationCodeInput();
  if (!validation.ok) {
    setSecurityMessage('securityVerifyMessage', validation.message, 'error');
    validation.focusTarget?.focus();
    return false;
  }

  securityActionState.verified = true;
  setSecurityMessage('securityVerifyMessage', '手机验证成功。', 'success');
  return true;
}

function sendSecurityPaymentCode() {
  setSecurityMessage('securityPaymentVerifyMessage', '功能未开放', 'info');
  return;
  const cooldownSeconds = getSecurityPaymentCodeCooldownSeconds();
  if (cooldownSeconds > 0) {
    setSecurityMessage('securityPaymentVerifyMessage', `请 ${cooldownSeconds}s 后再发送验证码。`, 'error');
    updateSecurityPaymentSendButton();
    return;
  }

  securityActionState.paymentCode = String(Math.floor(100000 + Math.random() * 900000));
  securityActionState.paymentCodeExpiresAt = Date.now() + 5 * 60 * 1000;
  securityActionState.paymentCodeCooldownExpiresAt = Date.now() + 60 * 1000;
  securityActionState.paymentVerified = false;

  // TODO(production): 接入真实短信服务后，必须移除前端明文展示验证码。
  setSecurityMessage('securityPaymentVerifyMessage', `验证码：${securityActionState.paymentCode}（5 分钟内有效）`, 'success');
  startSecurityPaymentCodeCountdown();
}

function verifySecurityPaymentCode() {
  const validation = validateSecurityPaymentCodeInput();
  if (!validation.ok) {
    setSecurityMessage('securityPaymentVerifyMessage', validation.message, 'error');
    validation.focusTarget?.focus();
    return false;
  }

  securityActionState.paymentVerified = true;
  setSecurityMessage('securityPaymentVerifyMessage', '手机验证成功。', 'success');
  return true;
}

function getSecurityPaymentCodeCooldownSeconds() {
  const expiresAt = Number(securityActionState.paymentCodeCooldownExpiresAt || 0);
  if (expiresAt <= 0) {
    return 0;
  }

  ];

      ok: false,

      focusTarget: codeInput
    };
  }

  if (!securityActionState.paymentCode || Date.now() > securityActionState.paymentCodeExpiresAt) {
    return {
      ok: false,
      message: '验证码已失效，请重新发送验证码。',

    };
  }

  if (code !== securityActionState.paymentCode) {

function saveSecurityPaymentPassword() {
  const codeValidation = validateSecurityPaymentCodeInput();
  if (!codeValidation.ok) {
    setSecurityMessage('securityPaymentVerifyMessage', codeValidation.message, 'error');
    setSecurityMessage('securityPaymentMessage', codeValidation.message, 'error');
    codeValidation.focusTarget?.focus();
    return;
  }
  securityActionState.paymentVerified = true;
  setSecurityMessage('securityPaymentVerifyMessage', '手机验证成功。', 'success');

  const helper = window.paymentPasswordMock;
  const passwordInput = document.getElementById('securityPaymentPasswordInput');
  const confirmInput = document.getElementById('securityPaymentPasswordConfirmInput');
  const password = passwordInput ? passwordInput.value.trim() : '';
  const confirmPassword = confirmInput ? confirmInput.value.trim() : '';

  const regex = helper?.PAYMENT_PASSWORD_REGEX || PAYMENT_PASSWORD_REGEX;
  if (!regex.test(password)) {
    setSecurityMessage('securityPaymentMessage', '支付密码必须是 6 位数字，请重新输入。', 'error');
    passwordInput?.focus();
    return;
  }

  if (password !== confirmPassword) {
    setSecurityMessage('securityPaymentMessage', '两次输入的支付密码不一致，请确认后重试。', 'error');
    confirmInput?.focus();
    return;
  }

  if (securityActionState.paymentMode === 'change') {
    const oldPassword = getCurrentStoredPaymentPassword();
    if (oldPassword && password === oldPassword) {
      setSecurityMessage('securityPaymentMessage', '新支付密码不能和旧支付密码一样，请重新设置。', 'error');
      passwordInput?.focus();
      return;
    }
  }

  try {
    if (helper && typeof helper.setPaymentPassword === 'function') {
      const result = helper.setPaymentPassword(password);
      if (!result?.ok) {
        throw new Error('支付密码保存失败，请稍后重试。');
      }
    } else {
      persistCurrentUserPatch({
        paymentPassword: password,
        walletPayPassword: password
      });
    }

    const successText = securityActionState.paymentMode === 'change' ? '支付密码修改成功' : '支付密码设置成功';
    resetSecurityActionState();
    syncCurrentUserState(true);
    showToast(successText, 'success');
  } catch (error) {
    setSecurityMessage('securityPaymentMessage', error.message || '支付密码保存失败，请稍后重试。', 'error');
  }
}

function hasWalletPaymentPassword() {

  if (currentUser) {
    candidates.push(currentUser);
  }

  const users = JSON.parse(localStorage.getItem('zhimai_users') || '[]');
  if (Array.isArray(users) && currentUser) {
    users.forEach((user) => {
      const sameId = String(user?.id || '') === String(currentUser.id || '');
      const samePhone = String(user?.phone || '').trim() !== '' && String(user?.phone || '').trim() === String(currentUser.phone || '').trim();
      if (sameId || samePhone) {
        candidates.push(user);
      }
    });
  }

  return candidates.some((item) => {
    const passwordText = String(
      item?.paymentPassword
      || item?.walletPayPassword
      || item?.payPassword
      || item?.walletPassword
      || item?.payPwd
      || ''
    ).trim();
    return PAYMENT_PASSWORD_REGEX.test(passwordText);
  });
}

function persistCurrentUserPatch(patch) {
  if (!currentUser) {
    throw new Error('当前用户不存在，请重新登录后再试');
  }

  if (typeof dataManager !== 'undefined' && dataManager && typeof dataManager.updateCurrentUserProfile === 'function') {
    return dataManager.updateCurrentUserProfile(currentUser.id, patch);
  }

  const users = JSON.parse(localStorage.getItem('zhimai_users') || '[]');
  const index = users.findIndex(user => String(user.id) === String(currentUser.id));
  const nextUser = { ...(index >= 0 ? users[index] : currentUser), ...patch };

  if (index >= 0) {
    users[index] = nextUser;
  } else {
    users.push(nextUser);
  }

  localStorage.setItem('zhimai_users', JSON.stringify(users));
  localStorage.setItem('zhimai_user', JSON.stringify(nextUser));
  if (sessionStorage.getItem('zhimai_user')) {
    sessionStorage.setItem('zhimai_user', JSON.stringify(nextUser));
  }

  return nextUser;
}

function saveProfile(event) {
  if (event) {
    event.preventDefault();
  }

  if (isProfileSaving) {
    return;

  const username = document.getElementById('editUsername').value.trim();
  const email = document.getElementById('editEmail').value.trim();
  const qq = document.getElementById('editQQ').value.trim();

  if (email && !EMAIL_REGEX.test(email)) {

  try {

    showToast('账号资料已保存', 'success');

function getProfileToastContainer() {
  let container = document.getElementById('profileToastContainer');
  if (!container) {
    container = document.createElement('div');
    container.id = 'profileToastContainer';
    container.setAttribute('aria-live', 'polite');
    container.setAttribute('aria-atomic', 'true');
    document.body.appendChild(container);
  }

  return container;
}

function showToast(message, type = 'success') {
  const toastTheme = {
    success: { icon: 'check-circle' },
    error: { icon: 'exclamation-circle' },
    info: { icon: 'info-circle' }
  };
  const safeType = Object.prototype.hasOwnProperty.call(toastTheme, type) ? type : 'info';
  const theme = toastTheme[safeType];
  const container = getProfileToastContainer();
  const toast = document.createElement('div');
  toast.className = `profile-toast profile-toast-${safeType}`;

  const iconWrap = document.createElement('span');
  iconWrap.className = 'profile-toast-icon';
  iconWrap.setAttribute('aria-hidden', 'true');
  const icon = document.createElement('i');
  icon.className = `fa fa-${theme.icon}`;
  iconWrap.appendChild(icon);

  const copy = document.createElement('span');
  copy.className = 'profile-toast-copy';
  copy.textContent = String(message == null ? '' : message);

  toast.appendChild(iconWrap);
  toast.appendChild(copy);
  container.appendChild(toast);

  requestAnimationFrame(() => {
    toast.classList.add('is-visible');
  });

  setTimeout(() => {
    toast.classList.remove('is-visible');
    toast.classList.add('is-exit');
    setTimeout(() => toast.remove(), 320);
  }, 2200);
}

    if (tabParam && ['overview', 'orders', 'wallet', 'coupons', 'notifications', 'settings', 'security'].includes(tabParam)) {
      switchTab(tabParam);
    } else {
      loadContent('overview');
    }
  }
});
</script>
